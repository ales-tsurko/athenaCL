[package]
name = "close-on-quit"
version = "0.1.0"
edition = "2021"
description = "Points the app menu's Quit at the window's close button, which iced can intercept"
publish = false

[dependencies]
raw-window-handle = "0.6"
thiserror = "2.0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSWindow",
] }

[lints.rust]
# AppKit is reached through the Objective-C runtime, which the compiler can't check; the app itself
# forbids unsafe code, so that it stays here
unsafe_code = "allow"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Don't panic.
string_slice = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
panic_in_result_fn = "warn"

# Don't fail silently.
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't do unsafe things with memory.
mem_forget = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Require intentional lint suppressions.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
