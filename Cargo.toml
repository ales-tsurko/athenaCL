[package]
name = "athenacl"
version = "2.0.0"
edition = "2021"

[package.metadata.bundle]
name = "athenaCL"
identifier = "by.alestsurko.athenacl"
icon = ["resources/athenaCL.icns"]
resources = ["resources/SGM-v2.01-YamahaGrand-Guit-Bass-v2.7.sf2"]

[dependencies]
ahash = "0.8.12"
async-channel = "2.5.0"
cpal = "0.18.2"
iced = { version = "0.14.0", features = [
    "advanced",
    "canvas",
    "image-without-codecs",
    "tokio",
    "wgpu",
] }
midi-player = "0.2.3"
quick-xml = "0.42.0"
rfd = "0.17.2"
rodio = { version = "0.22.2", default-features = false, features = [
    "symphonia-all",
    "symphonia-aiff",
    "symphonia-alac",
] }
# rustpython 0.5.0 hands libc::POSIX_SPAWN_SETSID to nix's PosixSpawnFlags, which libc 0.2.187
# retyped from c_int to c_short: it no longer builds on Linux. Cargo.lock holds libc at 0.2.186
# until rustpython releases a fix, so don't let `cargo update` carry it past that on its own.
rustpython-pylib = { version = "0.5.0", features = ["freeze-stdlib"] }
rustpython-stdlib = "0.5.0"
rustpython-vm = { version = "0.5.0", features = ["freeze-stdlib"] }
rustyline = { version = "18", default-features = false, features = ["with-file-history"] }
symphonia = { version = "0.5", default-features = false, features = ["wav", "aiff"] }
thiserror = "2.0.20"

[target.'cfg(target_os = "linux")'.dependencies]
# Native sound-server routing and change notifications; ALSA remains the fallback.
cpal = { version = "0.18.2", features = ["pipewire", "pulseaudio"] }

[dev-dependencies]
iced_test = "0.14.0"
tempfile = "3"

[build-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Don't panic.
string_slice = "warn"
indexing_slicing = "warn"
dbg_macro = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't fail silently.
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't do bad async stuff.
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"
large_futures = "warn"

# Don't do unsafe things with memory.
mem_forget = "warn"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't do potentially incorrect things with numbers.
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

# Don't do bad things that are easy to avoid.
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"

# Require intentional lint suppressions.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Our own code is not optimized, so that a rebuild after an edit stays quick.
opt-level = 0

[profile.dev.package."*"]
# The dependencies are, once: rustpython is too slow to run unoptimized, and it and the rest are
# built rarely enough that -O2 on them costs nothing day to day.
opt-level = 2
# Their debug info is only line numbers, which is all a backtrace through them needs. In full it
# is most of what the build writes: rustpython-vm alone goes from 61 to 222 MB.
debug = "line-tables-only"
